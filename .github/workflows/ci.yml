name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend / lint & type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.x"
      - run: uv python install 3.12
      - run: uv sync --dev
      - name: ruff check
        run: uv run ruff check app tests
      - name: ruff format --check
        run: uv run ruff format --check app tests
      - name: mypy
        run: uv run mypy app

  backend-test:
    name: Backend / tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.x"
      - run: uv python install 3.12
      - run: uv sync --dev
      - name: pytest
        run: uv run pytest -q --cov=app --cov-report=term-missing

  backend-migrations-postgres:
    name: Backend / migrations against Postgres
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recipe_ai
          POSTGRES_PASSWORD: recipe_ai
          POSTGRES_DB: recipe_ai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recipe_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.x"
      - run: uv python install 3.12
      - run: uv sync --dev
      - name: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://recipe_ai:recipe_ai@localhost:5432/recipe_ai
        run: uv run alembic upgrade head
      - name: seed the database
        env:
          DATABASE_URL: postgresql+asyncpg://recipe_ai:recipe_ai@localhost:5432/recipe_ai
        run: uv run python -m app.db.seed
      - name: alembic downgrade base (roundtrip check)
        env:
          DATABASE_URL: postgresql+asyncpg://recipe_ai:recipe_ai@localhost:5432/recipe_ai
        run: uv run alembic downgrade base

  frontend-lint:
    name: Frontend / lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  frontend-typecheck:
    name: Frontend / type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  frontend-test:
    name: Frontend / tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test

  frontend-build:
    name: Frontend / production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
